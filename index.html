* { box-sizing: border-box; }
body {
  background-color: var(--bg); background-image: var(--pattern); background-size: 170px 170px;
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: space-between; align-items: center; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 0; }
.month b { font-family: var(--font-display); font-size: 17px; min-width: 124px; text-align: center; }
.sq { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px; font-size: 20px; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 40px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.small button { height: 32px; padding: 0 10px; font-size: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.link { border: 0; background: transparent; color: var(--accent); padding: 4px 6px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; font-size: 14px; }
.banner .btn { background: transparent; border-color: currentColor; color: inherit; padding: 6px 12px; }

.docs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.doc { flex: 0 0 auto; min-width: 150px; max-width: 240px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.doc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
.doc span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(15, 30, 60, .05); }
.card h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.step { display: flex; flex-direction: column; gap: 10px; }
.step + .step { border-top: 1px dashed var(--line); padding-top: 14px; }
.sh { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.sh i { font-style: normal; font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } .row3 { grid-template-columns: 1fr 1fr; } .row3 > :first-child { grid-column: span 2; } }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
.lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 28px; flex-wrap: wrap; }
.lbl b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: 13px; overflow-wrap: anywhere; text-align: right; }
input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; font-size: 16px; color: var(--ink); }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 4px; }
.stepper button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 20px; line-height: 1; }
.stepper input { text-align: center; }

.teeth { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 4px; }
@media (min-width: 560px) { .teeth { grid-template-columns: 1fr 1fr; gap: 10px 18px; } }
.quad small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.qrow { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.t { height: 40px; min-width: 0; padding: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.t[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.types { display: flex; flex-wrap: wrap; gap: 8px; }
.ty { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-weight: 500; min-height: 44px; }
.ty.sm { min-height: 34px; padding: 5px 12px; font-size: 13.5px; }
.ty[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ty.other { border-style: dashed; }
.jaws { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.jaws .ty { border-radius: 10px; text-align: center; padding: 10px 8px; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.acts .sum { margin-right: auto; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; }

.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td.mono { font-family: var(--font-mono); font-size: 13px; }
.totalbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.totalbar .cap { font-size: 13px; color: var(--muted); }
.totalbar .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pdfbox { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.pdfbox .pl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); justify-content: space-between; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px 18px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty b { color: var(--ink); font-family: var(--font-display); font-size: 18px; display: block; }
.monthsum { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.monthsum .big { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.recent { display: flex; flex-direction: column; gap: 8px; }
.rc { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.rc b { font-weight: 600; overflow-wrap: anywhere; }
.rc span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rc .amt { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.cur { display: inline-flex; gap: 6px; }
.cur button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 16px; color: var(--muted); }
.cur button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; max-width: 90%; }
</style>

      '<datalist id="dl-doc">' + docs.map(function (x) { return '<option value="' + esc(x) + '">'; }).join("") + '</datalist></form>';
  }
  function updateSum() {
    var el = $("#f-sum"); if (!el) return;
    var d = ui.draft;
    el.textContent = t("sum") + ": " + money((Number(d.qty) || 0) * (Number(d.price) || 0));
  }

  /* ---------- PDF: drawn on a canvas (so Uzbek and Russian letters always display), then written as A4 pages ---------- */
  var FONT = '"IBM Plex Sans", "Segoe UI", system-ui, sans-serif';
  var DISPLAY = '"Familjen Grotesk", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif';
  function wrap(ctx, text, maxW) {
    var words = String(text || "").split(/\s+/).filter(Boolean), lines = [], cur = "";
    if (!words.length) return [""];
    words.forEach(function (w) {
      while (ctx.measureText(w).width > maxW) {
        var i = w.length; while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
        if (cur) { lines.push(cur); cur = ""; }
        lines.push(w.slice(0, i)); w = w.slice(i);
      }
      var s = cur ? cur + " " + w : w;
      if (ctx.measureText(s).width > maxW && cur) { lines.push(cur); cur = w; } else cur = s;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function buildPages(L, doctor, list) {
    var W = 794, H = 1123, S = 2, M = 46, pages = [], ctx, y;
    var cols = [["№", 28, "l"], ["th_patient", 112, "l"], ["th_formula", 124, "l"], ["th_type", 152, "l"], ["th_qty", 68, "r"], ["th_price", 100, "r"], ["th_sum", 106, "r"]];
    var xs = [], x = M; cols.forEach(function (c) { xs.push(x); x += c[1]; });
    var INK = "#111", MUT = "#555", LINE = "#bbb";
    function newPage() {
      var c = document.createElement("canvas"); c.width = W * S; c.height = H * S;
      ctx = c.getContext("2d"); ctx.scale(S, S); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.textBaseline = "alphabetic";
      pages.push(c); y = M;
    }
    function cell(text, i, yy) {
      var c = cols[i], p = 6, w = c[1] - p * 2;
      ctx.textAlign = c[2] === "r" ? "right" : "left";
      var tx = c[2] === "r" ? xs[i] + c[1] - p : xs[i] + p;
      var ls = wrap(ctx, text, w);
      ls.forEach(function (l, k) { ctx.fillText(l, tx, yy + k * 17); });
      return ls.length;
    }
    function tableHead() {
      ctx.font = "600 11px " + FONT; ctx.fillStyle = MUT;
      cols.forEach(function (c, i) { cell((c[0].indexOf("th_") === 0 ? tr(L, c[0]) : c[0]).toUpperCase(), i, y + 12); });
      y += 20; ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke(); y += 6;
    }
    newPage();
    var name = settings.labName || tr(L, "p_doc_title");
    ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = "700 28px " + DISPLAY; ctx.fillText(name, M, y + 24);
    if (settings.labName) { ctx.font = "500 12px " + FONT; ctx.fillStyle = MUT; ctx.fillText("DENTAL LABORATORY", M, y + 42); }
    var lines = []; if (settings.address) lines.push(settings.address); if (settings.phone) lines.push(tr(L, "p_phone") + ": " + settings.phone);
    ctx.textAlign = "right"; ctx.font = "400 12px " + FONT; ctx.fillStyle = MUT;
    lines.forEach(function (l, i) { ctx.fillText(l, W - M, y + 16 + i * 17); });
    y += 62; ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke(); y += 34;
    ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = "700 22px " + DISPLAY; ctx.fillText(tr(L, "p_doc_title"), M, y); y += 28;
    var dt = new Date(), ds = pad(dt.getDate()) + "." + pad(dt.getMonth() + 1) + "." + dt.getFullYear();
    [[tr(L, "p_doctor"), doctor], [tr(L, "p_period"), monthLabelL(L, ui.month)], [tr(L, "p_date"), ds]].forEach(function (p) {
      ctx.font = "400 14px " + FONT; ctx.fillStyle = MUT; ctx.textAlign = "left"; ctx.fillText(p[0] + ":", M, y);
      ctx.fillStyle = INK; ctx.font = "600 14px " + FONT; ctx.fillText(p[1], M + 130, y); y += 22;
    });
    y += 12; tableHead();
    var total = 0, qtySum = 0;
    list.forEach(function (r, idx) {
      ctx.font = "400 13px " + FONT;
      var f = formulaText(L, r), ty = typeLabel(L, r.type);
      var n = Math.max(wrap(ctx, r.patient, cols[1][1] - 12).length, wrap(ctx, f, cols[2][1] - 12).length, wrap(ctx, ty, cols[3][1] - 12).length);
      var rh = n * 17 + 10;
      if (y + rh > H - M - 40) { newPage(); tableHead(); }
      ctx.font = "400 13px " + FONT;
      var by = y + 15;
      ctx.fillStyle = MUT; cell(String(idx + 1), 0, by);
      ctx.fillStyle = INK; cell(r.patient, 1, by); cell(f, 2, by); cell(ty, 3, by);
      cell(fmt(r.qty), 4, by); cell(fmt(r.price), 5, by); ctx.font = "600 13px " + FONT; cell(fmt(sum(r)), 6, by);
      y += rh; ctx.strokeStyle = "#ddd"; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke();
      total += sum(r); qtySum += Number(r.qty) || 0;
    });
    if (y + 80 > H - M) newPage();
    y += 22; ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(M, y - 12); ctx.lineTo(W - M, y - 12); ctx.stroke();
    ctx.textAlign = "left"; ctx.fillStyle = MUT; ctx.font = "400 13px " + FONT; ctx.fillText(tr(L, "p_qty_total", { n: fmt(qtySum) }), M, y + 6);
    ctx.textAlign = "right"; ctx.fillStyle = INK; ctx.font = "500 14px " + FONT; ctx.fillText(tr(L, "p_total"), W - M, y + 6);
    ctx.font = "700 26px " + DISPLAY; ctx.fillText(moneyL(L, total), W - M, y + 36);
    pages.forEach(function (c, i) {
      var g = c.getContext("2d"); g.setTransform(S, 0, 0, S, 0, 0); g.textAlign = "center"; g.fillStyle = "#777"; g.font = "400 11px " + FONT;
      g.fillText((settings.labName ? settings.labName + " · " : "") + (i + 1) + " / " + pages.length, W / 2, H - 22);
    });
    return pages;
  }
  /* Minimal PDF writer: one JPEG image per A4 page. No external library. */
  function pdfFromCanvases(pages) {
    var enc = new TextEncoder(), chunks = [], offs = [], pos = 0, N = pages.length;
    function push(x) { if (typeof x === "string") x = enc.encode(x); chunks.push(x); pos += x.length; }
    function obj(n, parts) { offs[n] = pos; push(n + " 0 obj\n"); parts.forEach(push); push("\nendobj\n"); }
    function bytes(c) { var b = atob(c.toDataURL("image/jpeg", 0.92).split(",")[1]), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    push("%PDF-1.4\n");
    var kids = []; for (var i = 0; i < N; i++) kids.push((3 + 3 * i) + " 0 R");
    obj(1, ["<< /Type /Catalog /Pages 2 0 R >>"]);
    obj(2, ["<< /Type /Pages /Count " + N + " /Kids [" + kids.join(" ") + "] >>"]);
    pages.forEach(function (c, i) {
      var pg = 3 + 3 * i, ct = pg + 1, im = pg + 2, jpg = bytes(c), s = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
      obj(pg, ["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 " + im + " 0 R >> >> /Contents " + ct + " 0 R >>"]);
      obj(ct, ["<< /Length " + s.length + " >>\nstream\n", s, "\nendstream"]);
      obj(im, ["<< /Type /XObject /Subtype /Image /Width " + c.width + " /Height " + c.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n", jpg, "\nendstream"]);
    });
    var total = 2 + 3 * N, xr = pos;
    push("xref\n0 " + (total + 1) + "\n0000000000 65535 f \n");
    for (var n = 1; n <= total; n++) push(String(offs[n]).padStart(10, "0") + " 00000 n \n");
    push("trailer\n<< /Size " + (total + 1) + " /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF");
    return new Blob(chunks, { type: "application/pdf" });
  }
  function loadFonts() {
    if (!(document.fonts && document.fonts.load)) return Promise.resolve();
    var sample = "АбвГдЖзИйКлМн Hisob o'g'";
    return Promise.all([
      document.fonts.load('400 13px "IBM Plex Sans"', sample), document.fonts.load('500 14px "IBM Plex Sans"', sample),
      document.fonts.load('600 13px "IBM Plex Sans"', sample), document.fonts.load('700 28px "Familjen Grotesk"', sample)
    ]).catch(function () {}).then(function () { return document.fonts.ready; });
  }
  function makePdf() {
    if (ui.busy || !downloads) return;
    if (needSettings()) { ui.tab = "settings"; render(); toast(t("t_need_set")); return; }
    var list = inMonth().filter(function (r) { return r.doctor === ui.doctor; }).sort(byOrder);
    if (!list.length) return;
    ui.busy = true; render();
    var doctor = ui.doctor, L = ui.pdfLang || lang;
    loadFonts().then(function () {
      var blob = pdfFromCanvases(buildPages(L, doctor, list));
      var safe = doctor.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || tr(L, "p_who");
      if (ui.lastUrl) URL.revokeObjectURL(ui.lastUrl);
      ui.lastUrl = URL.createObjectURL(blob);
      return downloads.save({ filename: tr(L, "p_file") + "_" + safe + "_" + ui.month + ".pdf", data: blob });
    }).then(function () { toast(t("t_pdf_ok")); },
      function (e) { if (!e || e.code !== "declined") toast(t("t_pdf_fail") + " (" + ((e && e.code) || (e && e.message) || "!") + ")"); })
      .then(function () { ui.busy = false; render(); });
  }

  /* ---------- events ---------- */
  function go(tab) { ui.tab = tab; render(); window.scrollTo(0, 0); }
  function shiftMonth(n) {
    var p = ui.month.split("-").map(Number), dt = new Date(p[0], p[1] - 1 + n, 1);
    ui.month = dt.getFullYear() + "-" + pad(dt.getMonth() + 1); ui.editId = ""; ui.pendingDel = false;
    ui.draft = newDraft(ui.draft.doctor, null); render();
  }
  $("#prev").addEventListener("click", function () { shiftMonth(-1); });
  $("#next").addEventListener("click", function () { shiftMonth(1); });
  function applyAutoPrice() {
    var d = ui.draft;
    if (d.type && d.price === "") { var p = lastPrice(d.type, d.doctor); if (p != null) d.price = p; }
  }
  function download(name, blob) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
  }
  function endEdit() { ui.editId = ""; ui.pendingDel = false; ui.draft = newDraft(ui.doctor, null); var back = ui.returnTab || "add"; ui.returnTab = "add"; go(back); }
  document.addEventListener("click", function (e) {
    var tg = e.target, el;
    if ((el = tg.closest("[data-lang]"))) {
      lang = el.dataset.lang; try { localStorage.setItem(LS_LANG, lang); } catch (x) {} ui.pdfLang = null; return render();
    }
    if ((el = tg.closest("[data-tab]"))) { if (ui.editId && el.dataset.tab !== "add") { ui.editId = ""; ui.pendingDel = false; ui.draft = newDraft(ui.doctor, null); ui.returnTab = "add"; } return go(el.dataset.tab); }
    if ((el = tg.closest("[data-pdflang]"))) { ui.pdfLang = el.dataset.pdflang; return render(); }
    if ((el = tg.closest("[data-doc]"))) { ui.doctor = el.dataset.doc; return render(); }
    if ((el = tg.closest("[data-pickdoc]"))) { ui.draft.doctor = el.dataset.pickdoc; applyAutoPrice(); return render(); }
    if ((el = tg.closest("[data-qty]"))) {
      var dq = ui.draft; dq.qty = Math.max(1, (Number(dq.qty) || 1) + Number(el.dataset.qty)); dq.qtyTouched = true; return render();
    }
    if ((el = tg.closest("[data-jaw]"))) {
      var dj = ui.draft, j = el.dataset.jaw; dj.jaw = dj.jaw === j ? "" : j;
      if (!dj.qtyTouched) dj.qty = dj.jaw === "both" ? 2 : 1;
      return render();
    }
    if ((el = tg.closest("[data-tooth]"))) {
      var n = Number(el.dataset.tooth), d = ui.draft, i = d.teeth.indexOf(n);
      if (i >= 0) d.teeth.splice(i, 1); else d.teeth.push(n);
      return render();
    }
    if ((el = tg.closest("[data-type]"))) { ui.draft.type = el.dataset.type; ui.draft.custom = false; applyAutoPrice(); return render(); }
    if (tg.closest("[data-type-other]")) {
      var dd = ui.draft; dd.custom = true; if (TYPE_KEYS.indexOf(dd.type) >= 0) dd.type = "";
      render(); var ti = $("#f-type"); if (ti) ti.focus(); return;
    }
    if ((el = tg.closest("[data-cur]"))) {
      if ($("#s-name")) { settings.labName = $("#s-name").value.trim(); settings.phone = $("#s-phone").value.trim(); settings.address = $("#s-addr").value.trim(); }
      settings.cur = el.dataset.cur; return render();
    }
    if ((el = tg.closest("[data-edit]"))) {
      var r = rows.filter(function (x) { return x.id === el.dataset.edit; })[0]; if (!r) return;
      ui.returnTab = ui.tab === "report" ? "report" : "add";
      ui.editId = r.id; ui.pendingDel = false;
      var known = TYPE_KEYS.indexOf(r.type) >= 0 || distinct("type").indexOf(r.type) >= 0;
      ui.draft = { id: r.id, doctor: r.doctor, patient: r.patient, jaw: r.jaw || "", teeth: (r.teeth || []).slice(), teethOpen: (r.teeth || []).length > 0, type: r.type, custom: !known && !!r.type, qty: r.qty, qtyTouched: true, price: r.price, date: r.date, createdAt: r.createdAt };
      return go("add");
    }
    var a = tg.closest("[data-act]"); if (!a) return;
    var act = a.dataset.act;
    if (act === "pdf") return makePdf();
    if (act === "toggle-teeth") { ui.draft.teethOpen = !ui.draft.teethOpen; return render(); }
    if (act === "clear-teeth") { ui.draft.teeth = []; return render(); }
    if (act === "cancel") return endEdit();
    if (act === "del") {
      if (!ui.pendingDel) { ui.pendingDel = true; return render(); }
      var id = ui.editId;
      return removeRow(id).then(function () { toast(t("t_deleted")); endEdit(); });
    }
    if (act === "backup") { return download("hisob-zaxira-" + today() + ".json", new Blob([JSON.stringify({ v: 1, rows: rows, settings: settings }, null, 1)], { type: "application/json" })); }
    if (act === "save-settings") {
      var s = { labName: $("#s-name").value.trim(), phone: $("#s-phone").value.trim(), address: $("#s-addr").value.trim(), cur: settings.cur };
      return saveSettings(s).then(function () { toast(t("t_set_saved")); render(); });
    }
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id, d = ui.draft;
    if (id === "f-doctor") d.doctor = e.target.value;
    else if (id === "f-patient") d.patient = e.target.value;
    else if (id === "f-type") d.type = e.target.value;
    else if (id === "f-date") d.date = e.target.value;
    else if (id === "f-qty") { d.qty = e.target.value; d.qtyTouched = true; }
    else if (id === "f-price") d.price = e.target.value;
    else return;
    updateSum();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "restore" && e.target.files && e.target.files[0]) {
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var j = JSON.parse(rd.result), n = 0;
          (j.rows || []).forEach(function (r) {
            if (!r || !r.id) return;
            norm(r);
            var i = rows.findIndex(function (x) { return x.id === r.id; });
            if (i >= 0) rows[i] = r; else rows.push(r); n++;
          });
          if (j.settings) settings = Object.assign(settings, j.settings);
          lsSave(); render(); toast(t("t_restored", { n: n }));
        } catch (err) { toast(t("t_bad_file")); }
      };
      rd.readAsText(e.target.files[0]); return;
    }
    if (e.target.id === "f-type" || e.target.id === "f-doctor") {
      var d = ui.draft;
      if (d.price === "" && d.type) { var p = lastPrice(d.type, d.doctor); if (p != null) { d.price = p; var pi = $("#f-price"); if (pi) pi.value = p; updateSum(); } }
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "f") return; e.preventDefault();
    var d = ui.draft;
    var doctor = (d.doctor || "").trim(), patient = (d.patient || "").trim(), type = (d.type || "").trim();
    if (!doctor || !patient) return;
    if (!type) { toast(t("t_type")); return; }
    var r = {
      id: d.id || uid(), doctor: doctor, patient: patient, jaw: d.jaw, teeth: d.teeth.slice(), type: type,
      qty: Math.max(1, Number(d.qty) || 1), price: Number(d.price) || 0, date: d.date || today(), createdAt: d.createdAt || Date.now()
    };
    var wasEdit = !!d.id, back = wasEdit ? (ui.returnTab || "add") : "add";
    ui.editId = ""; ui.pendingDel = false; ui.returnTab = "add";
    ui.month = r.date.slice(0, 7); ui.doctor = r.doctor;
    ui.draft = newDraft(r.doctor, r.date);
    ui.tab = back;
    saveRow(r).then(function () {
      toast(wasEdit ? t("t_saved") : t("t_added")); render();
      if (wasEdit) window.scrollTo(0, 0);
      var p = $("#f-patient"); if (p && !wasEdit) p.focus();
    });
  });

  /* ---------- start ---------- */
  function localDownloads() {
    return {
      save: function (o) {
        var file = null;
        try { file = new File([o.data], o.filename, { type: o.data.type || "application/pdf" }); } catch (e) {}
        if (file && /\.pdf$/i.test(o.filename) && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: o.filename }).then(function () { return { status: "saved" }; }, function (e) {
            if (e && e.name === "AbortError") { var x = new Error("declined"); x.code = "declined"; throw x; }
            download(o.filename, o.data); return { status: "saved" };
          });
        }
        download(o.filename, o.data); return Promise.resolve({ status: "saved" });
      }
    };
  }
  function startLocal() { lsLoad(); ready = true; setReady = true; render(); }
  function startDb(d) {
    db = d;
    db.collection(COL).onSnapshot(function (snap) {
      rows = snap.docs.map(function (x) { return norm(Object.assign({}, x.data(), { id: x.id })); });
      ready = true; render();
    }, function () { ready = true; render(); });
    db.doc("settings/main").onSnapshot(function (snap) {
      if (snap.exists) settings = Object.assign({ labName: "", phone: "", address: "", cur: "so'm" }, snap.data());
      setReady = true; render();
    }, function () { setReady = true; render(); });
  }
  render();
  if (inClaude) {
    C.use("downloads").then(function (x) { downloads = x || null; render(); }, function () {});
    C.use("db").then(function (x) { if (x) startDb(x); else startLocal(); }, startLocal);
  } else {
    downloads = localDownloads();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
    startLocal();
  }
})();
