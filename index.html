<style>
/* Layout: header (title, language, month), three bottom tabs. Add = three-step entry card + recent entries. Report = month total, doctor tabs, work cards, total bar with PDF. Settings = lab details, backup. Clean theme, blue accent, light/dark/auto switch in Settings. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --ink: #131c2b;
  --muted: #586579;
  --line: #d3dae6;
  --accent: #1f4e8c;
  --accent-ink: #ffffff;
  --soft: #dde7f5;
  --bad: #b0322a;
  --warn-bg: #fbecd0;
  --warn-ink: #7a4800;
  --pattern: none;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141f; --surface: #161e2d; --surface-2: #1b2536; --ink: #e6ecf6; --muted: #94a3b8;
    --line: #28344a; --accent: #7fb0f0; --accent-ink: #08172e; --soft: #1d2f4b; --bad: #f08a80;
    --warn-bg: #36290f; --warn-ink: #e6b04f; color-scheme: dark;
    --pattern: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141f; --surface: #161e2d; --surface-2: #1b2536; --ink: #e6ecf6; --muted: #94a3b8;
  --line: #28344a; --accent: #7fb0f0; --accent-ink: #08172e; --soft: #1d2f4b; --bad: #f08a80;
  --warn-bg: #36290f; --warn-ink: #e6b04f; color-scheme: dark;
  --pattern: none;
}
* { box-sizing: border-box; }
:root[data-theme="light"] { color-scheme: light; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; flex: none; }
body {
  background-color: var(--bg); background-image: var(--pattern); background-size: 170px 170px;
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: space-between; align-items: center; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 0; }
.month b { font-family: var(--font-display); font-size: 17px; min-width: 124px; text-align: center; }
.sq { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px; font-size: 20px; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 40px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.small button { height: 32px; padding: 0 10px; font-size: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.link { border: 0; background: transparent; color: var(--accent); padding: 4px 6px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; font-size: 14px; }
.banner .btn { background: transparent; border-color: currentColor; color: inherit; padding: 6px 12px; }

.docs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.doc { flex: 0 0 auto; min-width: 150px; max-width: 240px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.doc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
.doc span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(15, 30, 60, .05); }
.card h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.step { display: flex; flex-direction: column; gap: 8px; }
.step + .step { border-top: 1px dashed var(--line); padding-top: 10px; }
.sh { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.sh i { font-style: normal; font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } .row3 { grid-template-columns: 1fr 1fr; } .row3 > :first-child { grid-column: span 2; } }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
.lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; flex-wrap: wrap; }
.lbl b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; font-size: 13px; overflow-wrap: anywhere; text-align: right; }
input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 16px; color: var(--ink); }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 4px; }
.stepper button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 20px; line-height: 1; }
.stepper input { text-align: center; }

.teeth { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 4px; }
@media (min-width: 560px) { .teeth { grid-template-columns: 1fr 1fr; gap: 10px 18px; } }
.quad small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.qrow { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.t { height: 36px; min-width: 0; padding: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.t[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.types { display: flex; flex-wrap: wrap; gap: 6px; }
.ty { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-weight: 500; font-size: 14px; min-height: 36px; }
.ty.sm { min-height: 34px; padding: 5px 12px; font-size: 13.5px; }
.ty[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ty.other { border-style: dashed; }
.jaws { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.jaws .ty { border-radius: 10px; text-align: center; padding: 6px 4px; font-size: 13.5px; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.acts .sum { margin-right: auto; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; }

.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td.mono { font-family: var(--font-mono); font-size: 13px; }
.totalbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.totalbar .cap { font-size: 13px; color: var(--muted); }
.totalbar .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pdfbox { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.pdfbox .pl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); justify-content: space-between; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px 18px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty b { color: var(--ink); font-family: var(--font-display); font-size: 18px; display: block; }
.monthsum { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.monthsum .big { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.recent { display: flex; flex-direction: column; gap: 8px; }
.rc { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.rc b { font-weight: 600; overflow-wrap: anywhere; }
.rc span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rc .amt { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stephead { display: flex; justify-content: space-between; align-items: baseline; }
.stephead b { font-family: var(--font-display); font-size: 17px; }
.stephead span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--accent); }
.crumb { text-align: left; border: 0; background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 600; }
.navrow { display: flex; gap: 8px; }
.navrow .btn { flex: 1; min-height: 44px; }
.navrow .btn.primary { flex: 2; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.rw { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.rw-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.rw-top b { font-weight: 600; overflow-wrap: anywhere; }
.rw-top .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rw-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rnote { color: var(--muted); font-size: 12px; margin-top: 2px; }
.pick { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-height: 42px; font-size: 16px; }
.pick.empty-v { color: var(--muted); }
.pick span { color: var(--muted); font-size: 12px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .42); z-index: 40; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(100%, 560px); max-height: 72vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 41; padding: 6px 8px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0, 0, 0, .18); }
.sheet h3 { font-family: var(--font-display); font-size: 15px; margin: 8px 8px 4px; color: var(--muted); font-weight: 600; }
.sheet button { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0 8px; min-height: 48px; font-size: 16px; }
.sheet button:last-child { border-bottom: 0; }
.sheet button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.sheet button[aria-pressed="true"]::after { content: "✓"; }
.sheet .other { color: var(--muted); }
.slot { display: flex; flex-direction: column; gap: 4px; padding: 0 0 0 10px; border-left: 3px solid var(--soft); }
.cur { display: inline-flex; gap: 6px; }
.cur button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 16px; color: var(--muted); }
.cur button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; max-width: 90%; }
</style>

    if (act === "save-settings") {
      var s = { labName: $("#s-name").value.trim(), phone: $("#s-phone").value.trim(), address: $("#s-addr").value.trim(), cur: settings.cur };
      return saveSettings(s).then(function () { toast(t("t_set_saved")); render(); });
    }
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id, d = ui.draft;
    if (id === "f-doctor") d.doctor = e.target.value;
    else if (id === "f-patient") d.patient = e.target.value;
    else if (id === "f-date") d.date = e.target.value;
    else if (id === "f-qty") { d.qty = e.target.value; d.qtyTouched = true; }
    else if (id === "f-note") d.note = e.target.value;
    else if (/^f-(type|price)(Up|Low)?$/.test(id)) { var m = id.match(/^f-(type|price)(Up|Low)?$/); d[m[1] + (m[2] || "")] = e.target.value; }
    else return;
    updateSum();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "restore" && e.target.files && e.target.files[0]) {
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var j = JSON.parse(rd.result), n = 0;
          (j.rows || []).forEach(function (r) {
            if (!r || !r.id) return;
            norm(r);
            var i = rows.findIndex(function (x) { return x.id === r.id; });
            if (i >= 0) rows[i] = r; else rows.push(r); n++;
          });
          if (j.settings) settings = Object.assign(settings, j.settings);
          lsSave(); render(); toast(t("t_restored", { n: n }));
        } catch (err) { toast(t("t_bad_file")); }
      };
      rd.readAsText(e.target.files[0]); return;
    }
    var id = e.target.id, d = ui.draft;
    if (id === "f-doctor") {
      var before = d.cur; syncDocCur();
      if (d.cur !== before) { render(); return; }
    }
    if (id === "f-doctor" || /^f-type(Up|Low)?$/.test(id)) {
      ["", "Up", "Low"].forEach(function (sl) {
        if (d["price" + sl] === "" && d["type" + sl]) {
          var p = lastPrice(d["type" + sl], d.doctor, d.cur);
          if (p != null) { d["price" + sl] = p; var pi = $("#f-price" + sl); if (pi) pi.value = p; updateSum(); }
        }
      });
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !e.target.closest || !e.target.closest("#f") || e.target.tagName !== "INPUT") return;
    if (!ui.draft.id && (ui.step || 1) < 3) { e.preventDefault(); goNext(); }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "f") return; e.preventDefault();
    var d = ui.draft;
    if (!d.id && (ui.step || 1) < 3) return goNext();
    var doctor = (d.doctor || "").trim(), patient = (d.patient || "").trim(), type = (d.type || "").trim();
    if (!doctor || !patient) return;
    var split = isSplit(d), note = (d.note || "").trim(), now0 = Date.now();
    if (split ? (!(d.typeUp || "").trim() || !(d.typeLow || "").trim()) : !type) { toast(t("t_type")); return; }
    var r, extraRows = [];
    if (split) {
      var mk = function (jaw, ty, pr, k) {
        return { id: uid() + k, doctor: doctor, patient: patient, jaw: jaw,
          teeth: d.teeth.filter(function (n) { return jaw === "up" ? n < 30 : n >= 30; }), type: ty.trim(),
          qty: 1, price: Number(pr) || 0, cur: d.cur, note: note, date: d.date || today(), createdAt: now0 + (k === "b" ? 1 : 0) };
      };
      r = mk("up", d.typeUp, d.priceUp, "a"); extraRows.push(mk("low", d.typeLow, d.priceLow, "b"));
    } else {
      r = {
        id: d.id || uid(), doctor: doctor, patient: patient, jaw: d.jaw, teeth: d.teeth.slice(), type: type,
        qty: Math.max(1, Number(d.qty) || 1), price: Number(d.price) || 0, cur: d.cur, note: note, date: d.date || today(), createdAt: d.createdAt || Date.now()
      };
    }
    var wasEdit = !!d.id, back = wasEdit ? (ui.returnTab || "add") : "add";
    ui.editId = ""; ui.pendingDel = false; ui.returnTab = "add";
    ui.month = r.date.slice(0, 7); ui.doctor = r.doctor;
    ui.draft = newDraft(r.doctor, r.date);
    ui.tab = back;
    Promise.all([saveRow(r)].concat(extraRows.map(saveRow))).then(function () {
      toast(wasEdit ? t("t_saved") : t("t_added")); render();
      if (wasEdit) window.scrollTo(0, 0);
      var p = $("#f-patient"); if (p && !wasEdit) p.focus();
    });
  });

  /* ---------- start ---------- */
  function localDownloads() {
    return {
      save: function (o) {
        var file = null;
        try { file = new File([o.data], o.filename, { type: o.data.type || "application/pdf" }); } catch (e) {}
        if (file && /\.pdf$/i.test(o.filename) && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: o.filename }).then(function () { return { status: "saved" }; }, function (e) {
            if (e && e.name === "AbortError") { var x = new Error("declined"); x.code = "declined"; throw x; }
            download(o.filename, o.data); return { status: "saved" };
          });
        }
        download(o.filename, o.data); return Promise.resolve({ status: "saved" });
      }
    };
  }
  function startLocal() { lsLoad(); ready = true; setReady = true; render(); }
  function startDb(d) {
    db = d;
    db.collection(COL).onSnapshot(function (snap) {
      rows = snap.docs.map(function (x) { return norm(Object.assign({}, x.data(), { id: x.id })); });
      ready = true; render();
    }, function () { ready = true; render(); });
    db.doc("settings/main").onSnapshot(function (snap) {
      if (snap.exists) settings = Object.assign({ labName: "", phone: "", address: "", cur: "so'm" }, snap.data());
      setReady = true; render();
    }, function () { setReady = true; render(); });
  }
  render();
  if (inClaude) {
    C.use("downloads").then(function (x) { downloads = x || null; render(); }, function () {});
    C.use("db").then(function (x) { if (x) startDb(x); else startLocal(); }, startLocal);
  } else {
    downloads = localDownloads();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
    startLocal();
  }
})();
</script>
